[project]
name = "adsec"
version = "0.8.0"
description = "Plateforme professionnelle d'audit et de pentest Active Directory (safe-by-default)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
    "ldap3>=2.9.1",
    "impacket>=0.12.0",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "types-PyYAML",
    "types-ldap3",
]

[project.scripts]
adsec = "adsec.cli.main:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adsec*"]

[tool.setuptools.package-data]
adsec = ["config/defaults/*.yaml", "database/schema/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "impacket.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
